apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-updater
  template:
    metadata:
      labels:
        app: dns-updater
    spec:
      containers:
      - name: dns-updater
        image: ghcr.io/epsilonrhorho/dns-updater:main
        command: ["/usr/local/bin/dns-updater.sh", "/etc/dns-updater/config"]
        env:
        - name: UPDATE_INTERVAL
          value: "300"
        - name: STORAGE_PATH
          value: /data
        volumeMounts:
        - name: config
          mountPath: /etc/dns-updater
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: dns-updater-config
      - name: data
        persistentVolumeClaim:
          claimName: dns-updater-storage
